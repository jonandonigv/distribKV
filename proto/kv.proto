syntax = "proto3";

package distribkv.kv;

option go_package = "github.com/jonandonigv/distribKV/kv;kv";

// KV is the client-facing key-value service backed by Raft.
// Every operation (including Get) goes through the Raft log in 0.1.0;
// ReadIndex is a later optimization (see AGENTS.md "KV Service Notes").
service KV {
  rpc Get(GetRequest) returns (GetResponse);
  rpc Put(PutRequest) returns (PutResponse);
  rpc Append(AppendRequest) returns (AppendResponse);
}

// OpType is serialized into the Raft log via Command.op. Enum may extend
// additively later (e.g. OP_TYPE_DELETE).
enum OpType {
  OP_TYPE_UNSPECIFIED = 0;
  OP_TYPE_GET = 1;
  OP_TYPE_PUT = 2;
  OP_TYPE_APPEND = 3;
}

// Command is the unit serialized into Raft log entries. The Raft layer
// treats Command.Command as opaque bytes; kv (de)serializes via these
// fields.
message Command {
  OpType op = 1;
  string key = 2;
  string value = 3;
  int64 client_id = 4;  // 8-byte crypto/rand id; see AGENTS.md "KV Service Notes"
  int64 sequence_num = 5;
}

message GetRequest {
  string key = 1;
}

message GetResponse {
  bool success = 1;
  string value = 2;
  bool wrong_leader = 3;
  int32 leader_id = 4; // -1 if unknown
  string error = 5;
}

message PutRequest {
  string key = 1;
  string value = 2;
}

message PutResponse {
  bool success = 1;
  bool wrong_leader = 2;
  int32 leader_id = 3; // -1 if unknown
  string error = 4;
}

message AppendRequest {
  string key = 1;
  string value = 2;
}

message AppendResponse {
  bool success = 1;
  bool wrong_leader = 2;
  int32 leader_id = 3; // -1 if unknown
  string error = 4;
}