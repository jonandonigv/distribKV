# distribKV canonical cluster definition (local dev).
#
# Each node matches itself by -id; peers are the other entries.
# data_dir is local to the repo (./data is gitignored); resolveDataDirs
# appends /<id> so each node persists under ./data/<id>/raft-state.json.
# The docker stack uses configs/cluster-docker.yaml (absolute data_dir
# under /var/lib, service-name listen_addrs).

cluster:
  name: distribkv-dev
  heartbeat_interval: 50ms
  election_timeout_min: 150ms
  election_timeout_max: 300ms
  data_dir: ./data
  snapshot_threshold: 0    # entries; 0 = never snapshot (deferred)

nodes:
  - id: 1
    listen_addr: "0.0.0.0:10001"
  - id: 2
    listen_addr: "0.0.0.0:10002"
  - id: 3
    listen_addr: "0.0.0.0:10003"